
name: Timetable BOT

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillowをインストール
        run: pip install Pillow

      - name: 時間割画像を4分割
        run: python scripts/split_timetable.py

      - name: GitHubに画像を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*.png
          if git diff --cached --quiet; then
            echo "画像に変更はありません。"
          else
            git commit -m "Update timetable images"
            git push
          fi

      - name: 生成したPNGを保存
        uses: actions/upload-artifact@v4
        with:
          name: timetable-images
          path: output/*.png
          if-no-files-found: error
          retention-days: 7
